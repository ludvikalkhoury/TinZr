<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>TinZr Web BLE</title>

	<style>
		:root{
			--bg: #020817;
			--base: #071529;
			--text: #E0E8FF;
			--subtext: #A8B3CF;
			--accent: #1E88E5;

			--btn: #1565C0;
			--btnHover: #1E88E5;
			--btnPress: #0D47A1;
			--btnDisabled: #0b2340;

			--cardRadius: 18px;
			--inputRadius: 12px;
			--tap: 52px; /* big touch target */
		}

		html, body { height: 100%; }
		body{
			margin: 0;
			background: var(--bg);
			color: var(--text);
			font-family: "Segoe UI","Roboto",system-ui,-apple-system,sans-serif;
			-webkit-font-smoothing: antialiased;
			-webkit-tap-highlight-color: transparent;
		}

		/* Long / phone layout */
		.wrap{
			width: 100%;
			max-width: 520px;
			margin: 0 auto;
			padding: 14px 14px 96px; /* bottom padding for sticky bar */
			display: flex;
			flex-direction: column;
			gap: 12px;
			box-sizing: border-box;
		}

		.card{
			background: rgba(255,255,255,0.04);
			border-radius: var(--cardRadius);
			padding: 14px;
			box-shadow: 0 0 0 1px rgba(30,136,229,0.06) inset;
		}

		.header .title{
			font-size: 18pt;
			font-weight: 650;
			color: #E3F2FD;
			line-height: 1.15;
		}
		.header .sub{
			font-size: 10pt;
			color: var(--subtext);
			margin-top: 4px;
		}

		.kv{
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
			margin-top: 8px;
		}
		.kv .k{ font-size: 9pt; color: var(--subtext); }
		.kv .v{ font-size: 10pt; color: var(--text); }

		.block{ display: flex; flex-direction: column; gap: 8px; }
		.label{ font-size: 10pt; color: var(--subtext); }

		input{
			height: var(--tap);
			background: var(--base);
			color: var(--text);
			border: 1px solid rgba(30,136,229,0.9);
			border-radius: var(--inputRadius);
			padding: 0 14px;
			outline: none;
			font-size: 12pt;
			box-sizing: border-box;
			width: 100%;
		}
		input::placeholder{ color: rgba(168,179,207,0.65); }

		button{
			height: var(--tap);
			width: 100%;
			background: var(--btn);
			color: #fff;
			border: none;
			border-radius: 16px;
			padding: 0 16px;
			font-weight: 650;
			font-size: 12pt;
			cursor: pointer;
			box-sizing: border-box;
		}
		button:hover{ background: var(--btnHover); }
		button:active{ background: var(--btnPress); }
		button:disabled{
			background: var(--btnDisabled);
			color: #70758c;
			cursor: not-allowed;
		}

		/* Small inline button (within device card) */
		.btnSmall{
			height: 46px;
			border-radius: 14px;
			font-size: 11.5pt;
		}

		.statusBox{
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
			font-size: 10pt;
			color: #B8C3E0;
			background: rgba(255,255,255,0.06);
			border-radius: 14px;
			padding: 12px;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
			min-height: 120px;
			line-height: 1.35;
		}

		.toggleRow{
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 10px 2px;
		}
		.toggleRow .toggleLabel{
			font-size: 12pt;
			font-weight: 650;
			color: #E3F2FD;
		}

		.toggle{
			position: relative;
			width: 64px;
			height: 34px;
			border-radius: 999px;
			background: rgb(110,110,120);
			cursor: pointer;
			flex: 0 0 auto;
		}
		.toggle.on{ background: #4CAF50; }
		.toggle .thumb{
			position: absolute;
			top: 3px;
			left: 3px;
			width: 28px;
			height: 28px;
			border-radius: 50%;
			background: rgb(240,240,240);
			transition: transform 120ms ease;
		}
		.toggle.on .thumb{ transform: translateX(30px); }

		/* Battery widget */
		.battRow{
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 2px 2px 8px;
		}
		.battery{
			position: relative;
			width: 62px;
			height: 30px;
			cursor: pointer;
			user-select: none;
			flex: 0 0 auto;
		}
		.battery .body{
			position: absolute;
			left: 3px;
			top: 3px;
			width: calc(100% - 9px);
			height: calc(100% - 6px);
			background: var(--bg);
			border: 1.5px solid #E0E8FF;
			border-radius: 7px;
			box-sizing: border-box;
			overflow: hidden;
		}
		.battery .fill{
			position: absolute;
			left: 1.5px;
			top: 1.5px;
			height: calc(100% - 3px);
			width: 0%;
			border-radius: 5px;
			background: #111827;
		}
		.battery .term{
			position: absolute;
			right: 0px;
			top: 10px;
			width: 7px;
			height: 10px;
			background: var(--bg);
			border: 1.2px solid #E0E8FF;
			border-radius: 2px;
			box-sizing: border-box;
		}
		.battery .pct{
			position: absolute;
			left: 3px;
			top: 3px;
			width: calc(100% - 9px);
			height: calc(100% - 6px);
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: 800;
			font-size: 12pt;
			color: #E0E8FF;
			pointer-events: none;
		}

		.fileBox{
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
			font-size: 10pt;
			color: #B8C3E0;
			background: rgba(255,255,255,0.06);
			border-radius: 14px;
			padding: 10px;
			white-space: pre;
			overflow: auto;
			max-height: 220px;
			line-height: 1.35;
		}

		/* Sticky bottom bar */
		.sticky{
			position: fixed;
			left: 0;
			right: 0;
			bottom: 0;
			padding: 10px 14px 14px;
			background: linear-gradient(to top, rgba(2,8,23,0.95), rgba(2,8,23,0.70), rgba(2,8,23,0));
			backdrop-filter: blur(8px);
			box-sizing: border-box;
		}
		.stickyInner{
			max-width: 520px;
			margin: 0 auto;
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
		}
		.stickyInner button{
			height: 56px;
			border-radius: 18px;
			font-size: 13pt;
		}
		.danger{
			background: rgba(244,67,54,0.95);
		}
		.danger:hover{ background: rgba(244,67,54,1); }
		.danger:active{ background: rgba(200,40,30,1); }

		.footer{
			text-align: right;
			font-size: 9pt;
			color: var(--subtext);
			padding: 0 4px;
		}

		/* Device card sub-layout */
		.devTopRow{
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:10px;
			margin-bottom: 6px;
		}
		.devName{
			font-size: 12pt;
			font-weight: 700;
			color: #E3F2FD;
			overflow:hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			max-width: 300px;
		}
		.devBadge{
			font-size: 9pt;
			color: var(--subtext);
		}
		.devBtns{
			display:grid;
			grid-template-columns: 1fr 1fr;
			gap:10px;
			margin-top: 10px;
		}
		.devBtns button{ height: 50px; border-radius: 16px; }
	</style>
</head>

<body>
	<div class="wrap">
		<div class="card header">
			<div class="title">TinZr Wearable SD</div>
			<div class="sub">Bluefy • Web Bluetooth • multi-device • phone timestamp logging</div>

			<div class="kv">
				<div class="k">Devices added</div>
				<div class="v" id="countLabel">0</div>
			</div>
			<div class="kv">
				<div class="k">Participant</div>
				<div class="v" id="pLabel">—</div>
			</div>
		</div>

		<div class="card">
			<div class="block">
				<div class="label">Participant</div>
				<input id="participant" placeholder="e.g., test001" />
				<button id="btnSetParticipant">Set Participant</button>
			</div>
		</div>

		<!-- Device cards are inserted here -->
		<div id="devices"></div>

		<div class="card">
			<div class="label" style="margin-bottom:8px;">Status</div>
			<div class="statusBox" id="status">Status: Idle</div>
		</div>

		<div class="footer">V1.0.0</div>
	</div>

	<div class="sticky">
		<div class="stickyInner">
			<button id="btnAdd">Add TinZr</button>
			<button id="btnStopAll" class="danger" disabled>Stop All</button>
		</div>
	</div>

<script>
/* ================== CONFIG ================== */
const TINZR_BLE_SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const TINZR_BLE_RX_CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
const TINZR_BLE_TX_CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a9";

const DEVICE_PREFIX = "TinZr";

const CMD_START = "S";
const CMD_STOP  = "E";
const CMD_BATT  = "BAT";
const CMD_SD_LS = "LS";

/* ================== GLOBAL UI ================== */
function setStatus(s){
	document.getElementById("status").textContent = "Status: " + s;
}
function webBleAvailable(){
	return !!(navigator.bluetooth && navigator.bluetooth.requestDevice);
}
function enc(s){ return new TextEncoder().encode(s); }

function nowStamp(){
	const d=new Date();
	const pad=(n,w=2)=>String(n).padStart(w,"0");
	const ms=pad(d.getMilliseconds(),3);
	return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}:${ms}.0000`;
}
function nowPrint(){
	const d=new Date();
	const pad=(n,w=2)=>String(n).padStart(w,"0");
	return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

/* BatteryWidget behavior */
function setBatteryUI(pctEl, fillEl, pct){
	if(pct===null||pct===undefined||Number.isNaN(pct)){
		pctEl.textContent="--";
		fillEl.style.width="0%";
		fillEl.style.background="#111827";
		return;
	}
	pct=Math.max(0,Math.min(100,Math.floor(pct)));
	pctEl.textContent=String(pct);
	fillEl.style.width=pct+"%";
	if(pct>=60) fillEl.style.background="#4CAF50";
	else if(pct>=30) fillEl.style.background="#FFC107";
	else fillEl.style.background="#F44336";
}

function participant(){
	return document.getElementById("participant").value.trim();
}

document.getElementById("btnSetParticipant").onclick = ()=>{
	const p = participant();
	document.getElementById("pLabel").textContent = p ? p : "—";
	setStatus(p ? ("Participant set: "+p) : "Participant is empty");
	refreshStopAll();
};

/* ================== DEVICE MODEL ================== */
let DEV_ID = 0;
const devices = []; // list of device models

function refreshCount(){
	document.getElementById("countLabel").textContent = String(devices.length);
}

function refreshStopAll(){
	const anyArmed = devices.some(d => d.loggingArmed);
	document.getElementById("btnStopAll").disabled = !anyArmed;
}

function mkDeviceModel(){
	return {
		id: ++DEV_ID,

		// BLE
		device: null,
		server: null,
		rxChar: null,
		txChar: null,

		// state
		connecting: false,
		connected: false,
		loggingArmed: false,
		heartbeatTimer: null,

		// notify buffering
		notifyTextBuf: "",

		// LS state
		lsCollecting: false,
		lsLines: [],

		// DOM refs (filled after card is created)
		el: {},
	};
}

async function writeBytes(d, bytes){
	if(!d.rxChar) throw new Error("Not connected");
	await d.rxChar.writeValue(bytes);
}
async function writeText(d, s){
	await writeBytes(d, enc(s));
}

async function safeWriteText(d, s){
	try{
		await writeText(d, s);
		return true;
	}catch(e){
		setStatus(`[${d.el.name.textContent}] BLE write failed → disconnecting`);
		await disconnectDevice(d);
		return false;
	}
}
async function safeWriteBytes(d, bytes){
	try{
		await writeBytes(d, bytes);
		return true;
	}catch(e){
		setStatus(`[${d.el.name.textContent}] BLE write failed → disconnecting`);
		await disconnectDevice(d);
		return false;
	}
}

function stopHeartbeat(d){
	if(d.heartbeatTimer){
		clearInterval(d.heartbeatTimer);
		d.heartbeatTimer=null;
	}
	d.el.hb.textContent = "—";
}
function startHeartbeat(d){
	stopHeartbeat(d);
	d.heartbeatTimer=setInterval(async ()=>{
		if(!d.loggingArmed) return;
		d.el.hb.textContent = nowPrint();
		await safeWriteText(d, "T:"+nowStamp());
	}, 5000);
}

/* Notify parsing per-device */
function handleLine(d, line){
	if(!line) return;

	// LS
	if(line.startsWith("LS:BEGIN")){
		d.lsCollecting=true;
		d.lsLines=[];
		d.el.files.textContent = "Listing files...";
		return;
	}
	if(d.lsCollecting && (line.startsWith("LS:END") || line.startsWith("LS: sent files ="))){
		d.lsCollecting=false;
		d.el.files.textContent = d.lsLines.length ? d.lsLines.join("\n") : "No files.";
		setStatus(`[${d.el.name.textContent}] LS complete`);
		return;
	}
	if(d.lsCollecting && line.startsWith("LS:ERR|")){
		d.lsLines.push(line.replace("LS:", ""));
		return;
	}
	if(d.lsCollecting && line.startsWith("LS:")){
		const payload=line.split(":", 2)[1]?.trim() || "";
		if(payload) d.lsLines.push(payload);
		return;
	}

	// Battery
	if(line.startsWith("BAT:")){
		const rawp=line.split(":")[1].replace("%","").trim();
		const pct=parseInt(rawp,10);
		if(!Number.isNaN(pct)){
			setBatteryUI(d.el.battPct, d.el.battFill, pct);
		}
		setStatus(`[${d.el.name.textContent}] ${line}`);
		return;
	}

	setStatus(`[${d.el.name.textContent}] ${line}`);
}

function handleNotifyFactory(d){
	return function(event){
		const chunk = new TextDecoder().decode(event.target.value);
		d.notifyTextBuf += chunk;
		d.notifyTextBuf = d.notifyTextBuf.replace(/\r/g, "");

		let idx;
		while((idx = d.notifyTextBuf.indexOf("\n")) >= 0){
			const line = d.notifyTextBuf.slice(0, idx).trim();
			d.notifyTextBuf = d.notifyTextBuf.slice(idx+1);
			if(line) handleLine(d, line);
		}

		if(d.notifyTextBuf.length > 512){
			const line = d.notifyTextBuf.trim();
			d.notifyTextBuf = "";
			if(line) handleLine(d, line);
		}
	}
}

/* ================== CARD UI ================== */
function createDeviceCard(d){
	const host = document.getElementById("devices");

	const card = document.createElement("div");
	card.className = "card";

	// Top row
	const top = document.createElement("div");
	top.className = "devTopRow";

	const name = document.createElement("div");
	name.className = "devName";
	name.textContent = `TinZr (not connected)`;

	const badge = document.createElement("div");
	badge.className = "devBadge";
	badge.textContent = `#${d.id}`;

	top.appendChild(name);
	top.appendChild(badge);

	// kv rows
	const kv1 = document.createElement("div");
	kv1.className = "kv";
	kv1.innerHTML = `<div class="k">Sync. trigger</div><div class="v" id="hb">—</div>`;

	// battery row (hidden until connected)
	const battRow = document.createElement("div");
	battRow.className = "battRow";
	battRow.style.display = "none";
	battRow.innerHTML = `
		<div class="label">Battery</div>
		<div class="battery" title="Tap to refresh battery">
			<div class="body"><div class="fill"></div></div>
			<div class="term"></div>
			<div class="pct">--</div>
		</div>
	`;

	// toggle row (hidden until connected)
	const toggleRow = document.createElement("div");
	toggleRow.className = "toggleRow";
	toggleRow.style.display = "none";
	toggleRow.innerHTML = `
		<div class="toggleLabel">SD Log (All)</div>
		<div class="toggle"><div class="thumb"></div></div>
	`;

	// SD retrieve (hidden until connected)
	const sd = document.createElement("div");
	sd.style.display = "none";
	sd.innerHTML = `
		<div class="label" style="margin-bottom:8px;">Retrieve from SD</div>
		<button class="btnSmall">Refresh file list (LS)</button>
		<div class="fileBox" style="margin-top:10px;">No files listed.</div>
	`;

	// buttons row
	const btns = document.createElement("div");
	btns.className = "devBtns";
	btns.innerHTML = `
		<button class="btnSmall">Connect</button>
		<button class="btnSmall danger" disabled>Stop</button>
	`;

	card.appendChild(top);
	card.appendChild(kv1);
	card.appendChild(battRow);
	card.appendChild(toggleRow);
	card.appendChild(sd);
	card.appendChild(btns);

	host.appendChild(card);

	// bind refs
	const hb = kv1.querySelector("#hb");
	const battery = battRow.querySelector(".battery");
	const battFill = battRow.querySelector(".fill");
	const battPct = battRow.querySelector(".pct");
	const toggle = toggleRow.querySelector(".toggle");
	const btnLS = sd.querySelector("button");
	const files = sd.querySelector(".fileBox");
	const btnConnect = btns.querySelectorAll("button")[0];
	const btnStop = btns.querySelectorAll("button")[1];

	d.el = {
		card, name, hb,
		battRow, battery, battFill, battPct,
		toggleRow, toggle,
		sd, btnLS, files,
		btnConnect, btnStop
	};

	// wiring
	btnConnect.onclick = async ()=>{
		if(d.connected) await disconnectDevice(d);
		else await connectDevice(d);
	};

	btnStop.onclick = async ()=>{
		await stopLogging(d);
	};

	toggle.onclick = async ()=>{
		if(!d.connected){
			setStatus(`[${d.el.name.textContent}] Not connected`);
			return;
		}
		const wantOn = !d.loggingArmed;
		setToggleUI(d, wantOn);
		if(wantOn) await startLogging(d);
		else await stopLogging(d);
	};

	battery.onclick = async ()=>{
		if(!d.connected) return;
		await safeWriteText(d, CMD_BATT);
	};

	btnLS.onclick = async ()=>{
		if(!d.connected) return;
		await sdListFiles(d);
	};

	// initial
	setBatteryUI(d.el.battPct, d.el.battFill, null);
	setToggleUI(d, false);

	return card;
}

function setToggleUI(d, on){
	if(on) d.el.toggle.classList.add("on");
	else d.el.toggle.classList.remove("on");
}

/* ================== CONNECT/DISCONNECT per device ================== */
async function connectDevice(d){
	if(d.connecting) return;
	if(!webBleAvailable()){
		setStatus("Web Bluetooth not available. Use Bluefy (iOS) or a WebBLE browser.");
		return;
	}
	d.connecting = true;
	d.el.btnConnect.disabled = true;
	d.el.btnConnect.textContent = "Connecting...";
	setStatus(`[${d.el.name.textContent}] Opening device picker...`);

	try{
		d.device = await navigator.bluetooth.requestDevice({
			filters: [{ namePrefix: DEVICE_PREFIX }],
			optionalServices: [TINZR_BLE_SERVICE_UUID]
		});
	}catch(e){
		d.connecting = false;
		d.el.btnConnect.disabled = false;
		d.el.btnConnect.textContent = "Connect";
		setStatus("Device picker cancelled");
		return;
	}

	// on disconnect: cleanup only this device
	d.device.addEventListener("gattserverdisconnected", async ()=>{
		setStatus(`[${d.el.name.textContent}] Disconnected`);
		await disconnectDevice(d);
	});

	try{
		setStatus(`[${d.device.name || "TinZr"}] Connecting...`);
		d.server = await d.device.gatt.connect();

		const service = await d.server.getPrimaryService(TINZR_BLE_SERVICE_UUID);
		d.rxChar = await service.getCharacteristic(TINZR_BLE_RX_CHAR_UUID);
		d.txChar = await service.getCharacteristic(TINZR_BLE_TX_CHAR_UUID);

		d._notifyHandler = handleNotifyFactory(d);
		await d.txChar.startNotifications();
		d.txChar.addEventListener("characteristicvaluechanged", d._notifyHandler);

		d.connected = true;

		// show UI now that this device is "added"
		d.el.name.textContent = d.device.name || `TinZr #${d.id}`;
		d.el.battRow.style.display = "";
		d.el.toggleRow.style.display = "";
		d.el.sd.style.display = "";
		d.el.btnConnect.textContent = "Disconnect";
		d.el.btnStop.disabled = false;

		setStatus(`[${d.el.name.textContent}] Connected`);
		await safeWriteText(d, CMD_BATT);

	}catch(e){
		setStatus("Connect failed");
		await disconnectDevice(d);
	}finally{
		d.connecting = false;
		d.el.btnConnect.disabled = false;
		refreshStopAll();
	}
}

async function disconnectDevice(d){
	// stop logging + heartbeat
	await stopLogging(d, true);

	// LS state
	d.lsCollecting = false;
	d.lsLines = [];
	d.notifyTextBuf = "";
	if(d.el.files) d.el.files.textContent = "No files listed.";

	// remove notify
	try{
		if(d.txChar && d._notifyHandler){
			try{
				d.txChar.removeEventListener("characteristicvaluechanged", d._notifyHandler);
				await d.txChar.stopNotifications();
			}catch(_){}
		}
	}catch(_){}

	// disconnect gatt
	try{
		if(d.device && d.device.gatt && d.device.gatt.connected){
			d.device.gatt.disconnect();
		}
	}catch(_){}

	d.connected = false;
	d.rxChar = null;
	d.txChar = null;
	d.server = null;

	// hide per-device UI again
	d.el.battRow.style.display = "none";
	d.el.toggleRow.style.display = "none";
	d.el.sd.style.display = "none";
	setToggleUI(d, false);
	setBatteryUI(d.el.battPct, d.el.battFill, null);

	d.el.hb.textContent = "—";
	d.el.btnConnect.textContent = "Connect";
	d.el.btnStop.disabled = true;

	if(d.device && d.device.name) d.el.name.textContent = d.device.name + " (disconnected)";
	else d.el.name.textContent = `TinZr #${d.id} (disconnected)`;

	refreshStopAll();
}

/* ================== LOGGING per device ================== */
async function setParticipantOnDevice(d){
	const p = participant();
	if(!p){
		setStatus("Participant is empty");
		return false;
	}
	const devName=(d.device && d.device.name) ? d.device.name : "TinZr";
	if(!(await safeWriteText(d, "P:"+p))) return false;
	if(!(await safeWriteText(d, "X: sub-"+p+"|device-"+devName+"|"+nowStamp()))) return false;
	return true;
}

async function startLogging(d){
	if(!d.connected){
		setStatus(`[${d.el.name.textContent}] Not connected`);
		setToggleUI(d, false);
		return;
	}

	const ok = await setParticipantOnDevice(d);
	if(!ok){
		setToggleUI(d, false);
		return;
	}

	const okS = await safeWriteBytes(d, new Uint8Array([ CMD_START.charCodeAt(0) ]));
	if(!okS){
		setToggleUI(d, false);
		return;
	}

	d.loggingArmed = true;
	startHeartbeat(d);
	setStatus(`[${d.el.name.textContent}] Logging armed (T: every 5s).`);
	refreshStopAll();
	d.el.btnStop.disabled = false;
}

async function stopLogging(d, silent=false){
	stopHeartbeat(d);

	if(d.connected){
		await safeWriteBytes(d, new Uint8Array([ CMD_STOP.charCodeAt(0) ]));
	}

	d.loggingArmed = false;
	setToggleUI(d, false);
	if(!silent) setStatus(`[${d.el.name.textContent}] Logging stopped.`);
	refreshStopAll();
}

/* ================== SD list per device ================== */
async function sdListFiles(d){
	d.lsCollecting = false;
	d.lsLines = [];
	d.el.files.textContent = "Listing files...";
	setStatus(`[${d.el.name.textContent}] Listing files...`);
	await safeWriteText(d, CMD_SD_LS);
}

/* ================== ADD DEVICE + STOP ALL ================== */
async function addDevice(){
	const d = mkDeviceModel();
	devices.push(d);
	createDeviceCard(d);
	refreshCount();
	refreshStopAll();

	// optional: immediately prompt connect when added
	await connectDevice(d);
}

document.getElementById("btnAdd").onclick = async ()=>{
	await addDevice();
};

document.getElementById("btnStopAll").onclick = async ()=>{
	for(const d of devices){
		if(d.loggingArmed){
			await stopLogging(d);
		}
	}
};

/* init */
refreshCount();
refreshStopAll();

if(!webBleAvailable()){
	setStatus("Web Bluetooth not available. Use Bluefy (iOS) or a WebBLE browser.");
	document.getElementById("btnAdd").disabled = true;
}
</script>
